name: CI de PMM Interactivo

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

# Nota: este YAML valida y publica artefactos.
# El bloqueo de merge (required checks) se configura en GitHub:
# Settings → Branches → Branch protection → Require status checks.

jobs:

  # ==========================================
  # BACKEND - Node.js + MySQL + Jest
  # ==========================================
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pmm_interactivo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: pmm-backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: pmm_interactivo
      DB_DIALECT: mysql
      JWT_SECRET: una_cadena_secreta_muy_segura_para_pmm_2026

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pmm-backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Ejecutar pruebas del backend
        run: npm test -- --runInBand --json --outputFile=jest-results.json

      - name: Publicar artefacto Jest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jest-${{ github.sha }}
          path: pmm-backend/jest-results.json
          if-no-files-found: ignore
          retention-days: 14


  # ==========================================
  # FRONTEND - React + Vite
  # ==========================================
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pmm-frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pmm-frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Construir frontend
        run: npm run build

      - name: Publicar artefacto build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: pmm-frontend/dist
          if-no-files-found: ignore
          retention-days: 7


  # ==========================================
  # PYTHON-IA - Flask + Scikit-learn
  # ==========================================
  python-ia:
    name: python-ia
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pmm-ia-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias de IA
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas del clasificador
        run: python test_clasificador.py | tee clasificador-resultado.txt

      - name: Publicar artefacto clasificador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-clasificador-${{ github.sha }}
          path: pmm-ia-service/clasificador-resultado.txt
          if-no-files-found: ignore
          retention-days: 14
