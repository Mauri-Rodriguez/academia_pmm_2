name: CI de PMM Interactivo

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Nota: el YAML valida backend/frontend/Python y publica artefactos.
# El bloqueo real de merge (required checks) se configura en GitHub:
# Settings → Branches → Branch protection rules → Require status checks.

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "root"
          MYSQL_DATABASE: pmm_interactivo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: pmm-backend/package-lock.json
      - name: Instalar y probar backend
        working-directory: pmm-backend
        run: |
          npm ci
          npm test -- --runInBand --json --outputFile=jest-results.json
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: "root"
          DB_NAME: pmm_interactivo
          DB_DIALECT: mysql
          JWT_SECRET: una_cadena_secreta_muy_segura_para_pmm_2026
      - name: Publicar artefacto backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jest-${{ github.sha }}
          path: pmm-backend/jest-results.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: pmm-frontend/package-lock.json
      - name: Lint y build frontend
        working-directory: pmm-frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Publicar artefacto frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log-${{ github.sha }}
          path: |
            pmm-frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  python-ia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          # Alineado con Railway (python@3.13.16).
          python-version: "3.13"
      - name: Instalar deps y clasificador
        working-directory: pmm-ia-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python test_clasificador.py | tee clasificador-resultado.txt
      - name: Publicar artefacto python
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-clasificador-${{ github.sha }}
          path: pmm-ia-service/clasificador-resultado.txt
          if-no-files-found: ignore
